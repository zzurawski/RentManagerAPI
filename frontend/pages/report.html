<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentManager API - Report</title>
</head>
<body>
    <h1>RentManager Report</h1>
    <nav>
        <a href="../index.html">Home</a> |
        <a href="report.html">Report</a> |
        <a href="tenants.html">Tenants</a>
    </nav>
    <div id="status">Loading report from server...</div>
    <ul id="report-list" aria-live="polite"></ul>
    <form>
        <input type="text" label="Property IDs" id="propertyIds" placeholder="Property IDs (comma-separated)">
        <input type="date" id="asOfDate" placeholder="As of Date">
        <input type="button" value="Run Report" onclick="loadReport()">
    </form>
    <script>
        async function loadReport() {
            try {
                const propertyIds = document.getElementById('propertyIds').value;
                const asOfDate = document.getElementById('asOfDate').value;
                const res = await fetch(`http://localhost:3000/reports/occupancy-listing?propertyIds=${propertyIds}&asOfDate=${asOfDate}`);
                if (!res.ok) throw new Error('Server returned ' + res.status + ' ' + res.statusText);
                const reportHtml = await res.text();
                document.getElementById('status').textContent = '';
                const reportList = document.getElementById('report-list');
                reportList.innerHTML = reportHtml;
            } catch (err) {
                console.error('Error getting report:', err);
                document.getElementById('status').textContent = 'Error loading report.';
            }
        }
        document.getElementById('propertyIds').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                loadReport();
            }
        });
    </script>
</body>
</html>
