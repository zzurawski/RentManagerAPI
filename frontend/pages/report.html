<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentManager API - Report</title>
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="./reports.css">
</head>
<body>

    <nav>
        <a href="../index.html">Home</a> |
        <a href="report.html">Report</a> |
        <a href="tenants.html">Tenants</a>
        <span id="nav-user-info" style="margin-left:12px; color:var(--muted)">Not signed in</span>
    </nav>

    <div id="status">Loading report from server...</div>
    <ul id="report-list" aria-live="polite"></ul>
    <form>
        <input type="text" label="Property IDs" id="propertyIds" placeholder="Property IDs (comma-separated)">
        <input type="date" id="asOfDate" placeholder="As of Date">
        <input type="button" value="Run Report" onclick="loadReport()">
    </form>
    <script>
        function getRmToken() { return localStorage.getItem('rm_api_token') || window.rmApiToken || ''; }

        async function loadReport() {
            try {
                const propertyIds = document.getElementById('propertyIds').value;
                const asOfDate = document.getElementById('asOfDate').value;
                const token = getRmToken();
                const url = `http://localhost:3000/reports/occupancy-listing?propertyIds=${encodeURIComponent(propertyIds)}&asOfDate=${encodeURIComponent(asOfDate)}`;
                const res = await fetch(url, { headers: token ? { 'X-RM12Api-ApiToken': token } : {} });
                if (!res.ok) throw new Error('Server returned ' + res.status + ' ' + res.statusText);
                const reportHtml = await res.text();
                document.getElementById('status').textContent = '';
                const reportList = document.getElementById('report-list');
                reportList.innerHTML = reportHtml;
            } catch (err) {
                console.error('Error getting report:', err);
                document.getElementById('status').textContent = 'Error loading report.';
            }
        }
        document.getElementById('propertyIds').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                loadReport();
            }
        });

        // populate nav user info from localStorage
        (function populateNav() {
            try {
                const user = localStorage.getItem('rm_api_user');
                const dbid = localStorage.getItem('rm_api_dbid');
                const nav = document.getElementById('nav-user-info');
                if (user && dbid) nav.textContent = user + ' @ ' + dbid;
            } catch (e) { }
        })();
    </script>
</body>
</html>
