<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Templates</title>
</head>
<body>
    <h1>Letter Templates</h1>
    <nav>
        <a href="../index.html">Home</a> |
        <a href="report.html">Report</a> |
        <a href="tenants.html">Tenants</a> |
        <a href="letterTemplates.html">Letter Templates</a>
    </nav>
    <div id="letter-container" style="display: flex; justify-content: space-between; gap: 20px; align-items: flex-start;">
        <div id="template-names" style="margin-top: 20px; width: 30%; border: 1px solid #ccc; padding: 10px; display: flex; flex-direction: column; box-sizing: border-box;">
            <p id="status-letters"></p>
            <ul id="letter-template-list" aria-live="polite" style="margin: 0; padding-left: 20px;"></ul>
        </div>

        <div id="template-content" style="margin-top: 20px; width: 60%; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; overflow: auto; max-height: 75vh; background: #fff;">
            <h2 style="margin-top: 0;">Template Content</h2>
            <iframe id="letter-preview-frame" title="Letter template preview"
                style="width: 100%; min-height: 600px; border: 0; background: white; display: block; overflow: auto;">
            </iframe>
        </div>
    </div>

    <script>
        async function loadLetterTemplates() {
            try {
                const res = await fetch('http://localhost:3000/lettertemplates');
                if (!res.ok) throw new Error('Server returned ' + res.status + ' ' + res.statusText);

                const letterTemplates = await res.json();
                console.log('Letter Templates:', letterTemplates);

                const list = document.getElementById('letter-template-list');
                list.innerHTML = '';

                letterTemplates.forEach(template => {
                    const li = document.createElement('li');
                    const templateName = template.Name ?? template.name ?? '';
                    const templateId = template.LetterTemplateID ?? template.lettertemplateid ?? '';
                    li.textContent = templateName + ' (ID: ' + templateId + ')';
                    li.style.cursor = 'pointer';
                    li.style.marginBottom = '8px';
                    li.addEventListener('click', () => previewLetterTemplate(templateId));
                    list.appendChild(li);
                });
            } catch (err) {
                console.error('Error loading letter templates:', err);
                document.getElementById('status-letters').textContent = 'Error loading letter templates.';
            }
        }

        window.onload = loadLetterTemplates;

        async function previewLetterTemplate(templateId) {
            const tenantId = 2;
            const frame = document.getElementById('letter-preview-frame');
            frame.srcdoc = '<p>Loading letter template content...</p>';
            try {
                const res = await fetch(`http://localhost:3000/lettertemplates/${templateId}/preview/${tenantId}`);
                if (!res.ok) throw new Error('Server returned ' + res.status + ' ' + res.statusText);

                frame.srcdoc = await res.text();
            } catch (err) {
                console.error('Error loading letter template content:', err);
                frame.srcdoc = '<p>Error loading letter template content.</p>';
            }
        }
    </script>
</body>
</html>
