<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Templates</title>
</head>
<body>
    <h1>Letter Templates</h1>
    <nav>
        <a href="../index.html">Home</a> |
        <a href="report.html">Report</a> |
        <a href="tenants.html">Tenants</a> |
        <a href="letterTemplates.html">Letter Templates</a>
        <a href="test.html">Test</a>
    </nav>
    <div id="letter-container" style="display: flex; justify-content: space-between; gap: 20px; align-items: flex-start;">
        <div id="template-names" style="margin-top: 20px; width: 30%; border: 1px solid #ccc; padding: 10px; display: flex; flex-direction: column; box-sizing: border-box;max-height: 75vh; overflow: scroll; background: #fff;">
            <p id="status-letters"></p>
            <ul id="letter-template-list" aria-live="polite" style="margin: 0; padding-left: 20px;"></ul>
        </div>
        <div id="template-content" style="margin-top: 20px; width: 60%; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; min-height: 75vh; background: #fff;">
            <h2 style="margin-top: 0;text-align: center;">Template Content</h2>
            <iframe id="letter-preview-frame" title="Letter template preview"
                style="width: 100%; height: 75vh; border: 0; background: white; display: block; overflow: auto;">
            </iframe>
        </div>
    </div>

    <script>
        async function loadLetterTemplates() {
            try {
                const res = await fetch('http://localhost:3000/lettertemplates');
                if (!res.ok) throw new Error('Server returned ' + res.status + ' ' + res.statusText);

                const letterTemplates = await res.json();

                const list = document.getElementById('letter-template-list');
                list.innerHTML = '';

                letterTemplates.forEach(template => {
                    const li = document.createElement('li');
                    const templateName = template.Name ?? template.name ?? '';
                    const templateId = template.LetterTemplateID ?? template.lettertemplateid ?? '';
                    li.textContent = templateName + ' (ID: ' + templateId + ')';
                    li.style.cursor = 'pointer';
                    li.style.marginBottom = '8px';
                    li.addEventListener('click', () => previewLetterTemplate(templateId));
                    list.appendChild(li);
                });
            } catch (err) {
                console.error('Error loading letter templates:', err);
                document.getElementById('status-letters').textContent = 'Error loading letter templates.';
            }
        }

        window.onload = loadLetterTemplates;
        // Track last blob URL to revoke when replaced
        window._lastLetterPreviewUrl = null;
        window.addEventListener('unload', () => {
            if (window._lastLetterPreviewUrl) URL.revokeObjectURL(window._lastLetterPreviewUrl);
        });

        // Render the preview response as executed HTML inside the iframe.
        // If server returns a URL, fetch that file. Otherwise treat response text as HTML.
        async function previewLetterTemplate(templateId) {
            const tenantId = 2;
            const frame = document.getElementById('letter-preview-frame');
            frame.srcdoc = '<p>Loading letter template content...</p>';
            try {
                const res = await fetch(`http://localhost:3000/lettertemplates/${templateId}/preview/${tenantId}`);
                if (!res.ok) throw new Error('Server returned ' + res.status + ' ' + res.statusText);

                let responseText = await res.text();

                // If responseText looks like a URL, try fetching it
                let html = responseText;
                const looksLikeUrl = /^(https?:)?\/\//i.test(responseText) || /\.html(?:$|\?)/i.test(responseText) || responseText.startsWith('/');
                if (looksLikeUrl) {
                    try {
                        const fetchUrl = new URL(responseText, window.location.href).href;
                        const fetched = await fetch(fetchUrl);
                        if (fetched.ok) {
                            const ct = fetched.headers.get('content-type') || '';
                            if (ct.includes('text/html') || fetchUrl.endsWith('.html')) {
                                html = await fetched.text();
                            } else {
                                // Not HTML — navigate iframe to URL
                                frame.removeAttribute('srcdoc');
                                frame.src = fetchUrl;
                                return;
                            }
                        } else {
                            // couldn't fetch, navigate iframe to URL as fallback
                            frame.removeAttribute('srcdoc');
                            frame.src = fetchUrl;
                            return;
                        }
                    } catch (e) {
                        // invalid URL or CORS — fall back to treating responseText as HTML
                        html = responseText;
                    }
                }

                // If HTML is escaped (e.g. &lt;div&gt;), decode it
                if (html.includes('&lt;') && html.includes('&gt;')) {
                    const ta = document.createElement('textarea');
                    ta.innerHTML = html;
                    html = ta.value;
                }

                // Create a blob so iframe navigates to a document and executes scripts/styles
                try {
                    const blob = new Blob([html], { type: 'text/html' });
                    const blobUrl = URL.createObjectURL(blob);
                    if (window._lastLetterPreviewUrl) URL.revokeObjectURL(window._lastLetterPreviewUrl);
                    window._lastLetterPreviewUrl = blobUrl;
                    frame.removeAttribute('srcdoc');
                    frame.src = blobUrl;
                } catch (blobErr) {
                    // If Blob creation fails, fallback to srcdoc (scripts may be limited)
                    frame.srcdoc = html;
                }
            } catch (err) {
                console.error('Error loading letter template content:', err);
                frame.srcdoc = '<p>Error loading letter template content.</p>';
            }
        }
    </script>
</body>
</html>
