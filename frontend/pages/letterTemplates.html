<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Templates</title>
    <link rel="stylesheet" href="../index.css">
</head>
<body>
    
    <nav>
        <a href="../index.html"><img alt="home" src="../resources/home.png"/></a>
        <a href="report.html">Reports</a> |
        <a href="letterTemplates.html"><img alt="letters" src="../resources/envelope.png" /></a>
    </nav>

    <div id="header">
        <h3>Letter Previewer</h3>

    </div>
    
    <div id="letter-container" style="display: flex; justify-content: space-between; gap: 20px; align-items: flex-start;">
        
        <div id="template-names" style="margin-top: 20px; width: 30%; border: 1px solid #ccc; padding: 10px; display: flex; flex-direction: column; box-sizing: border-box;max-height: 75vh; overflow: scroll; background: #fff;">
            <h2>All Templates</h2>
            <ul id="letter-template-list" aria-live="polite"></ul>
        </div>
        
        <div id="template-content" style="margin-top: 20px; width: 70%; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; min-height: 75vh; background: #fff;">
            <h2 id="template-title">Template title</h2>
            <iframe id="letter-preview-frame" title="Letter template preview"
                style="width: 100%; height: 75vh; border: 0; background: white; display: block; overflow: auto;">
            </iframe>
        </div>
    
    </div>

    <script>
        // grabs the Letter Templates from RM and shows the names
        async function loadLetterTemplates() {
            try {
                const res = await fetch('http://localhost:3000/lettertemplates');
                if (!res.ok) throw new Error('Server returned ' + res.status + ' ' + res.statusText);

                const letterTemplates = await res.json();

                const list = document.getElementById('letter-template-list');
                list.innerHTML = '';

                letterTemplates.forEach(template => {
                    const li = document.createElement('li');
                    const templateName = template.Name ?? template.name ?? '';
                    const templateId = template.LetterTemplateID ?? template.lettertemplateid ?? '';
                    li.textContent = templateName;
                    li.addEventListener('click', () => {
                        previewLetterTemplate(templateId);
                        li.style.backgroundColor = '#e0e0e0';
                        document.getElementById('template-title').textContent = templateName + ' preview';

                        // Reset background color once unselected
                        Array.from(list.children).forEach(sibling => {
                            if (sibling !== li) sibling.style.backgroundColor = '';
                        });
                    });
                    list.appendChild(li);
                });
            } catch (err) {
                console.error('Error loading letter templates:', err);
                document.getElementById('template-names').textContent = 'Error loading letter templates.';
            }
        }
        // get Letter templates immediately
        window.onload = loadLetterTemplates;

        window._lastLetterPreviewUrl = null;
        window.addEventListener('unload', () => {
            if (window._lastLetterPreviewUrl) URL.revokeObjectURL(window._lastLetterPreviewUrl);
        });

        // show a preview of the merged template against a tenant id (for script) and the output sent as HTML to mimic email received
        async function previewLetterTemplate(templateId) {
            const tenantId = 2;
            const frame = document.getElementById('letter-preview-frame');
            frame.srcdoc = '<p>Loading letter template content...</p>';
            try {
                const res = await fetch(`http://localhost:3000/lettertemplates/${templateId}/preview/${tenantId}`);
                if (!res.ok) throw new Error('Server returned ' + res.status + ' ' + res.statusText);

                let responseText = await res.text();

                let html = responseText;
                const isURL = /^(https?:)?\/\//i.test(responseText) || /\.html(?:$|\?)/i.test(responseText) || responseText.startsWith('/');
                if (isURL) {
                    try {
                        const fetchUrl = new URL(responseText, window.location.href).href;
                        const responseFromURL = await fetch(fetchUrl);
                        if (responseFromURL.ok) {
                            const ct = responseFromURL.headers.get('content-type') || '';
                            if (ct.includes('text/html') || fetchUrl.endsWith('.html')) {
                                html = await responseFromURL.text();
                            } else {
                                frame.removeAttribute('srcdoc');
                                frame.src = fetchUrl;
                                return;
                            }
                        } else {
                            frame.removeAttribute('srcdoc');
                            frame.src = fetchUrl;
                            return;
                        }
                    } catch (e) {
                        html = error ? `<p>Error fetching letter template content: ${e.message}</p>` : responseText;
                    }
                }

                // If HTML is escaped (e.g. &lt;div&gt;), decode it
                if (html.includes('&lt;') && html.includes('&gt;')) {
                    const outputString = document.createElement('textarea');
                    outputString.innerHTML = html;
                    html = outputString.value;
                }

                // blob so HTML actually executes as rendered
                try {
                    const blob = new Blob([html], { type: 'text/html' });
                    const blobUrl = URL.createObjectURL(blob);
                    if (window._lastLetterPreviewUrl) URL.revokeObjectURL(window._lastLetterPreviewUrl);
                    window._lastLetterPreviewUrl = blobUrl;
                    frame.removeAttribute('srcdoc');
                    frame.src = blobUrl;
                } catch (blobErr) {
                    frame.srcdoc = html;
                }
            } catch (err) {
                console.error('Error loading letter template content:', err);
                frame.srcdoc = '<p>Error loading letter template content.</p>';
            }
        }
    </script>
</body>
</html>
